<!doctype html>
<html
  lang="pt-BR"
  data-composition-variables='[
    {"id":"handle","type":"string","label":"@ da rede (CTA)","default":"@seu_perfil"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Giro de notícias</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #060709; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden; background: #060709;
        color: #ffffff; font-family: "Montserrat", sans-serif;
        --y: #ffe500; --ink: #0b0d10; --win: #101318; --line: #262b33; --sub: #aab2bc;
      }
      .ico { width: 1em; height: 1em; flex: none; display: block; }

      /* ---------- câmera: sempre tela cheia; sobe para abrir espaço aos prints (sem split desde 28/10) ---------- */
      #cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 50% %%ORIGIN%%px; z-index: 0; }
      #fala { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      /* piso escuro do estúdio: esconde a borda de baixo do vídeo quando a câmera sobe; a legenda fica sobre ele */
      #floor { position: absolute; left: 0; top: %%FLOOR0%%px; width: 1080px; height: 760px; z-index: 1; pointer-events: none;
        background: linear-gradient(to bottom, rgba(6,7,9,0) 0px, rgba(6,7,9,0.72) 110px, #060709 172px); }
      #cover-dim { position: absolute; inset: 0; z-index: 1; opacity: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 40%, rgba(6,7,9,0.35), rgba(6,7,9,0.82)); }
      #endfade { position: absolute; inset: 0; z-index: 3; background: #060709; opacity: 0; pointer-events: none; }

      /* ---------- prints reais flutuando no espaço livre (sobre o tronco, nunca no rosto) ---------- */
      .scene { position: absolute; left: %%CARD_X%%px; top: 0; width: %%CARD_W%%px; height: 1920px; z-index: 2; perspective: 1400px; }
      .pc { position: absolute; left: 0; width: %%CARD_W%%px; border-radius: 20px; overflow: hidden; background: #ffffff;
        border: 2px solid color-mix(in srgb, var(--c) 72%, #ffffff 0%);
        box-shadow: 0 30px 80px rgba(0,0,0,0.62), 0 0 54px color-mix(in srgb, var(--c) 38%, transparent);
        transform-origin: 50% 100%; }
      .pc.cv { transform-origin: 50% 0%; }
      .pc-src { height: %%STRIP%%px; display: flex; align-items: center; gap: 12px; padding: 0 18px 0 8px; background: var(--win);
        border-bottom: 2px solid var(--line); font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 22px;
        color: var(--sub); white-space: nowrap; }
      .pc-src > .ico { font-size: 24px; }
      .pc-src > b { color: #f4f6f8; font-weight: 700; }
      .pc-src .dt { margin-left: auto; color: var(--y); }
      .pc-src .tp { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 8px; border-radius: 10px;
        background: var(--y); color: var(--ink); font-family: "Montserrat", sans-serif; font-weight: 900; font-size: 19px; letter-spacing: 0.05em; }
      .pc-src .tp .ico { font-size: 24px; }
      .pc-shot { position: relative; overflow: hidden; }
      .pc-in { position: absolute; left: 0; top: 0; width: %%CARD_W%%px; }
      .pc-in img { position: absolute; left: 0; display: block; }
      .hl { position: absolute; background: rgba(255,229,0,0.66); mix-blend-mode: multiply; border-radius: 6px; transform-origin: 0 50%; }
      /* matéria de fundo escuro (Apple Newsroom): multiply some no preto -> faixa translúcida + sublinhado */
      .pc.dk { background: #000000; }
      .pc.dk .hl { background: rgba(255,229,0,0.30); mix-blend-mode: normal; border-bottom: 6px solid var(--y); border-radius: 4px; }

      /* ---------- tags de abertura de cada notícia (mesma faixa dos prints) ---------- */
      .ov { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
      .tag { position: absolute; left: 60px; display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
      .tg-main { display: inline-flex; align-items: center; gap: 14px; padding: 12px 16px 12px 16px; border-radius: 16px; background: var(--y);
        color: var(--ink); font-weight: 900; font-size: 44px; letter-spacing: 0.01em; white-space: nowrap;
        box-shadow: 0 18px 44px rgba(0,0,0,0.5), 0 0 40px color-mix(in srgb, var(--c) 35%, transparent); }
      .tg-main .ico { font-size: 48px; }
      .tg-main .num { margin-left: 6px; padding: 4px 12px; border-radius: 10px; background: var(--ink); color: var(--c);
        font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; }
      .tg-sub { display: inline-block; max-width: 900px; padding: 10px 20px; border-radius: 12px; background: rgba(11,13,16,0.9);
        border-left: 6px solid var(--c); color: #ffffff; font-weight: 800; font-size: 34px; line-height: 1.16; letter-spacing: 0.01em;
        box-shadow: 0 18px 44px rgba(0,0,0,0.45); }
      .tg-sub.long { font-size: 29px; }
      #handle { position: absolute; left: 60px; top: 1556px; padding: 4px 14px; border-radius: 10px; background: rgba(11,13,16,0.5);
        font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px; color: rgba(255,255,255,0.72); letter-spacing: 0.02em; }
      #fontes { position: absolute; left: 60px; top: 880px; width: 900px; padding: 14px 20px; border-radius: 14px; background: rgba(11,13,16,0.86);
        font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 21px; line-height: 1.45; color: var(--sub); letter-spacing: 0.02em; }
      #fontes b { color: var(--y); }
      .slot { position: absolute; left: 0; right: 0; display: flex; justify-content: center; }
      .chip { display: inline-flex; align-items: center; gap: 18px; padding: 14px 32px 14px 16px; border-radius: 999px;
        background: rgba(11,13,16,0.94); border: 3px solid var(--y); font-weight: 800; font-size: 38px; color: #ffffff;
        white-space: nowrap; box-shadow: 0 18px 50px rgba(0,0,0,0.4); }
      #end-follow .h { color: var(--y); font-weight: 900; }
      .plus { width: 60px; height: 60px; border-radius: 50%; background: var(--y); display: flex; align-items: center; justify-content: center; flex: none; }
      .plus .ico { font-size: 36px; }

      /* ---------- legenda karaokê (faixa fixa logo abaixo dos prints) ---------- */
      #caps-w { z-index: 5; }
      #caps { position: absolute; left: 70px; right: 70px; top: %%CAP_Y%%px; height: 110px; transform-origin: 50% 50%; }
      .cg { position: absolute; left: 0; right: 0; top: 0; height: 110px; display: flex; justify-content: center; align-items: center;
        column-gap: 0.24em; font-weight: 800; font-size: 76px; line-height: 1; letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
      .cw { display: inline-block; color: #ffffff;
        text-shadow: 0 0 2px rgba(0,0,0,0.9), 2px 2px 0 rgba(0,0,0,0.85), -2px 2px 0 rgba(0,0,0,0.85), 2px -2px 0 rgba(0,0,0,0.85), -2px -2px 0 rgba(0,0,0,0.85),
          0 3px 6px rgba(0,0,0,0.75); }
      .cw.k { color: var(--y); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%%DUR%%" data-width="1080" data-height="1920" data-fps="30">
      <div id="cam">
        <video id="fala" class="clip" src="assets/footage/%%FALA%%" data-start="0" data-duration="%%DURV%%" data-track-index="0" playsinline data-has-audio="true"></video>
      </div>
      <div id="floor"></div>
      <div id="cover-dim"></div>

%%SCENES%%

      <div id="endfade"></div>

%%TAGS%%

%%HANDLE%%

      <!-- legenda palavra a palavra -->
      <div id="caps-w" class="ov clip" data-start="0" data-duration="%%DUR%%" data-track-index="6">
        <div id="caps">
%%CAPS_DOM%%
        </div>
      </div>

      <audio id="bgm" src="assets/music/trilha.m4a" data-start="0" data-duration="%%DUR%%" data-track-index="10" data-volume="1"></audio>
%%SFX%%
    </div>
    <script>
      const D = %%DATA%%;
      const tl = gsap.timeline({ paused: true });
      const IR = { immediateRender: false };
      function pop(sel, t, d = 0.3) {
        tl.fromTo(sel, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: d, ease: "back.out(1.8)", ...IR }, t);
      }
      function rise(sel, t, d = 0.28) {
        tl.fromTo(sel, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: d, ease: "power3.out", ...IR }, t);
      }
      function slam(sel, t, d = 0.22) {
        tl.fromTo(sel, { opacity: 0, scale: 1.18 }, { opacity: 1, scale: 1, duration: d, ease: "power3.out", ...IR }, t);
      }
      function slideIn(sel, t, d = 0.26) {
        tl.fromTo(sel, { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: d, ease: "power3.out", ...IR }, t);
      }
      // print entra flutuando: sobe e "deita" na frente dele (perspectiva leve), sem tremer depois
      function enter(sel, t) {
        tl.fromTo(sel, { opacity: 0, y: 70, rotationX: 16 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.4, ease: "power3.out", ...IR }, t);
      }

      // ---------- câmera: sobe na troca de notícia (abre espaço para os prints), micro-zoom nos cortes ----------
      gsap.set("#cam", { y: -D.cam[0][2], scale: 1 });
      gsap.set("#floor", { y: -D.cam[0][2] });
      let lastY = D.cam[0][2];
      D.cam.forEach(([t, s, y, story]) => {
        if (story && y !== lastY) {
          tl.to("#cam", { y: -y, scale: s, duration: 0.45, ease: "power2.inOut", ...IR }, Math.max(0, t - 0.2));
          tl.to("#floor", { y: -y, duration: 0.45, ease: "power2.inOut", ...IR }, Math.max(0, t - 0.2));
        } else {
          tl.set("#cam", { y: -y, scale: s }, t);
          tl.set("#floor", { y: -y }, t);
        }
        lastY = y;
      });

      // ---------- print em tela cheia (quando não cabe abaixo do queixo): o estúdio desfoca e escurece atrás ----------
      D.covers.forEach(([t0, t1]) => {
        tl.to("#fala", { filter: "blur(16px) brightness(0.55)", duration: 0.25, ease: "power2.out", ...IR }, t0);
        tl.to("#cover-dim", { opacity: 1, duration: 0.25, ease: "power2.out", ...IR }, t0);
        tl.to("#fala", { filter: "blur(0px) brightness(1)", duration: 0.25, ease: "power2.in", ...IR }, t1 - 0.05);
        tl.to("#cover-dim", { opacity: 0, duration: 0.25, ease: "power2.in", ...IR }, t1 - 0.05);
      });
      // fim: escurece no fim da fala; a tag do CTA, as fontes e o chip de seguir seguram na tela escura
      tl.to("#endfade", { opacity: 0.9, duration: 0.35, ease: "power1.in", ...IR }, D.endfade);

      // ---------- prints: aproximação lenta (cresce para baixo da borda de cima, não sobe no queixo) e rolagem ----------
      gsap.set(".hl", { scaleX: 0 });
      D.cards.forEach(c => {
        tl.fromTo("#" + c.id + " .pc-shot", { scale: 1 }, { scale: 1.035, duration: c.d, ease: "none", ...IR }, c.t);
        if (c.pan) tl.fromTo("#" + c.id + " .pc-in", { y: 0 }, { y: -c.pan, duration: c.p1 - c.p0, ease: "sine.inOut", ...IR }, c.p0);
        if (c.cover) tl.set("#" + c.id, { scale: %%COV_W%% / %%CARD_W%% }, c.t);
      });
      D.marks.forEach(([id, t, d]) => tl.fromTo("#" + id, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "none", ...IR }, t));

%%JS%%

      // ---------- legenda karaokê: palavra entra no instante falado, palavra-chave em amarelo ----------
      gsap.set([".cg", ".cw"], { opacity: 0 });
      D.caps.forEach((g, gi) => {
        tl.set("#g" + gi, { opacity: 1 }, g.t0);
        g.w.forEach((w, wi) => {
          const sel = "#w" + gi + "_" + wi;
          if (w.k) tl.fromTo(sel, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.16, ease: "back.out(2.6)", ...IR }, w.t);
          else tl.fromTo(sel, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.12, ease: "power2.out", ...IR }, w.t);
        });
        tl.set("#g" + gi, { opacity: 0 }, g.t1);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
